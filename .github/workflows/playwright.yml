name: Playwright E2E

# Manual trigger only, on purpose: this suite runs against the live prod
# backend with no teardown (see TESTING_IMPROVEMENTS.md), so running it on
# every push/PR would pile up duplicate records faster than a human ever
# would. Trigger it by hand (Actions tab → Run workflow) when you want a
# pre-release smoke run, until Phase 2 (disposable per-run project) lands.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_PROJECT_NAME: ${{ vars.TEST_PROJECT_NAME }}
          HEADLESS: '1'
        run: npx playwright test --project=chromium

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
